<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SphereView · 全景照片工作台</title>
  <link rel="stylesheet" href="/static/sphereview.css">
  <script src="/static/sphereview.js" defer></script>
</head>
<body>
<header class="site-head">
  <a class="identity" href="/"><span aria-hidden="true">◎</span> SphereView</a>
  <a class="track" href="/prepare">图像准备 ↗</a>
</header>
<div class="layout">
  <aside class="library" aria-label="全景项目">
    <h1>全景照片</h1>
    <button id="upload-open" class="accent">导入全景照片</button>
    <button id="demo" type="button">载入合成演示</button>
    <button id="restore-open" type="button">恢复工程 ZIP</button>
    <input id="upload" type="file" accept="image/png,image/jpeg" hidden>
    <input id="restore" type="file" accept=".zip" hidden>
    <ul id="projects"></ul>
  </aside>
  <main>
    <section id="empty" class="empty">
      <h2>从全景取出一张照片</h2>
      <p>导入一张 2:1 经纬全景照片，或使用合成演示探索不同方位。</p>
    </section>
    <section id="workspace" hidden>
      <div class="project-head">
        <div><h2 id="project-name"></h2><p id="source-meta"></p></div>
        <a id="project-zip" class="action">下载工程 ZIP ↓</a>
      </div>
      <div class="workgrid">
        <div class="visuals">
          <section class="stage">
            <nav id="modes" aria-label="显示方式">
              <button data-mode="view">透视取景</button>
              <button data-mode="leveled">校准全图</button>
              <button data-mode="cube">立方体</button>
              <button data-mode="planet">小行星</button>
              <button data-mode="source">原始照片</button>
            </nav>
            <div id="primary-image" class="primary-image">
              <img id="hero" alt="当前全景预览">
              <div id="cube-grid" class="cube-grid" hidden></div>
            </div>
            <div class="stage-footer">
              <span id="mode-description"></span>
              <a id="output" class="action accent">下载 PNG ↓</a>
            </div>
          </section>
          <section class="navigator">
            <div class="section-title"><h3>方向图</h3><span id="marker-position"></span></div>
            <div id="direction-map">
              <img id="navigation-image" alt="从左到右为 −180° 至 180° 的校准全图">
              <div id="tour-overlay" aria-hidden="true"></div>
              <span id="marker" aria-hidden="true"></span>
            </div>
            <div class="angles"><span>−180°</span> <span>−90°</span> <span>0°</span> <span>90°</span> <span>180°</span></div>
            <p id="tour-legend" class="readout" hidden><span class="tour-key covered"></span>巡看覆盖 <span class="tour-key gap"></span>未覆盖</p>
            <p id="probe-readout" class="readout">点击方向图转到指定位置并读取原图像素。</p>
          </section>
          <section class="bookmarks">
            <div class="section-title"><h3>取景书签</h3></div>
            <form id="bookmark-form" class="inline-form">
              <input id="bookmark-name" maxlength="50" required placeholder="例如：东侧栏杆" aria-label="书签名称">
              <button type="submit">保存当前取景</button>
            </form>
            <div id="bookmark-list"></div>
            <div class="tour-controls">
              <label>巡看张数上限 <input id="tour-limit" type="number" min="1" max="12" step="1" value="4"></label>
              <button id="tour-run" type="button">生成巡看清单</button>
            </div>
            <div id="tour-result" hidden></div>
          </section>
        </div>
        <aside class="inspector">
          <section>
            <h3>取景控制</h3>
            <form id="view-form">
              <label>水平角 <input name="yaw" type="number" min="-180" max="180" step="any" required></label>
              <label>仰角 <input name="pitch" type="number" min="-89.5" max="89.5" step="any" required></label>
              <label>旋转角 <input name="roll" type="number" min="-180" max="180" step="any" required></label>
              <label>水平视角 <input name="fov" type="number" min="24" max="140" step="any" required></label>
              <label>画幅 <select name="aspect"><option>16:9</option><option>3:2</option><option>4:5</option><option>1:1</option></select></label>
              <button type="submit" class="accent">应用取景</button>
            </form>
          </section>
          <section>
            <h3>全景姿态</h3>
            <form id="pose-form">
              <label>全站水平角 <input name="yaw" type="number" min="-180" max="180" step="any" required></label>
              <label>全站仰角 <input name="pitch" type="number" min="-85" max="85" step="any" required></label>
              <label>全站旋转角 <input name="roll" type="number" min="-180" max="180" step="any" required></label>
              <button type="submit">应用姿态</button>
            </form>
          </section>
          <section>
            <h3>曝光</h3>
            <form id="exposure-form">
              <label>曝光 EV <input name="exposure" type="number" min="-3" max="3" step="any" required></label>
              <button type="submit">调整曝光</button>
            </form>
          </section>
          <section id="planet-settings" hidden>
            <h3>小行星</h3>
            <form id="planet-form">
              <label>旋转角 <input name="spin" type="number" min="-180" max="180" step="any" required></label>
              <label>比例 <input name="radius" type="number" min="0.4" max="2.5" step="any" required></label>
              <button type="submit">应用小行星比例</button>
            </form>
          </section>
          <section>
            <h3>原图接缝</h3>
            <button type="button" id="seam">检查左右接缝</button>
            <div id="seam-result"></div>
          </section>
          <section>
            <h3>项目名称</h3>
            <form id="rename-form">
              <label><span class="visually-hidden">项目名称</span><input id="new-name" name="name" maxlength="80" required></label>
              <button type="submit">重命名</button>
            </form>
          </section>
        </aside>
      </div>
    </section>
  </main>
</div>
<div id="status" role="status" aria-live="polite"></div>
</body>
</html>
